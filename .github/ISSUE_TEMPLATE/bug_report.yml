name: Bug report
description: Report a reproducible launcher, input, audio, graphics, or packaging problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload ROMs, saves, extracted game assets, or screenshots containing private information.
  - type: input
    id: version
    attributes:
      label: DesktopGoldenEye version
      placeholder: 0.1.0.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows and GPU
      placeholder: Windows 11 24H2, Radeon RX 7800 XT
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Display mode
      options: [Fullscreen, Borderless, Windowed, Not applicable]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Include the mission/menu and launcher settings needed to reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety check
      options:
        - label: I have not attached a ROM, save, extracted game asset, credential, or private path I do not want public.
          required: true
